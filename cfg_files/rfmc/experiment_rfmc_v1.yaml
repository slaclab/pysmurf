# RFMC carrier, version 1 firmware (rfmc-cryo-det MicrowaveMuxRfmcCarrier v1.2.x: baseband
# IF with the QUAD daughter cards), both quads, eight bands, external reference.
#
# What is specific to the RFMC: the per-band IQ swaps. With iq_swap_in = iq_swap_out = 0
# the DSP synthesis and analysis are mirrored on every band of this carrier, so a tone on
# a channel is received in the channel at the opposite offset (slaclab/rfmc-cryo-det#30).
# The low-side LO bands (0, 1, 4, 5) swap the synthesis I/Q and the high-side LO bands
# (2, 3, 6, 7), whose down-conversion inverts, swap the analysis I/Q; a channel's tone
# then lands in that channel at band centre plus its tone frequency offset in RF. The
# firmware package's own defaults set the same values since v1.2.4, but setup() writes
# these from this file.
#
# Everything else -- attenuators (UC 12 on bands 0-3, 0 on bands 4-7, DC 0), tuning,
# wiring and amplifier values -- is converted from
# cfg_files/b33/experiment_b33_rfc1-2_C05-40_s4_2xLB_extref.cfg, the AMC configuration
# the RFMC prototype was first run with; a site overrides its own with `inherit:`.
