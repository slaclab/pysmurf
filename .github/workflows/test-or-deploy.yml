name: test-or-deploy
on: [push, pull_request]

jobs:

  # Tests

  # Run flake8 on all .py files. Should block deploys to Read The Docs.
  flake8:
    name: Flake8 Tests
    runs-on: ubuntu-24.04
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Setup python3
      - name: setup python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      # Install flake8 modules
      - name: Install dependencies
        run: |
          python -m pip install \
            flake8-rst-docstrings \
            flake8-sfs \
            flake8-import-order

      # Run Flake 8 tests. tests/cryodaq/ is linted with the package it checks;
      # tests/core/ is not yet clean and is left for the change that cleans it.
      - name: Flake8
        run: flake8 --count python/ tests/cryodaq/

  # Validate the server docker image definitions
  docker-definitions:
    name: Docker Definition Tests
    runs-on: ubuntu-24.04
    if: github.actor != 'dependabot[bot]'
    steps:
      # Checkout the code.
      # We use ssh key authentication to be able to access other private
      # repositories (like the firmware repository).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        #with:
        #  ssh-key: ${{ secrets.SLACLAB_KEY }}

      # Validate the server 'definitions.sh' file.
      # Note about tokens: In this stage we need to use the SLACLAB TOKEN
      # to be able to access the other private repositories (GITHUB_TOKEN
      # only gives access to this repository).
      - name: Validate the server definitions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.SWH76_TOKEN }}
        run: |
          cd docker/server/
          ./validate.sh
          cd -

  # Documentation automatic build tests
  test-docs:
    name: Documentation Build Tests
    runs-on: ubuntu-24.04
    needs: [flake8, docker-definitions]   # Run only if all checks passed
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Setup python 3.12
      - name: Setup python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      # Install requirements, pysmurf, and docs dependencies
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install .
          python -m pip install -r docs/requirements.txt

      # Try to build the documentation
      - name: Build documentation
        run: |
          cd docs
          make html

  # Server tests
  test-server:
    name: Server Tests
    runs-on: ubuntu-24.04
    needs: [flake8, docker-definitions]   # Run only if all checks passed
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Setup Docker build environment
      - name: Set up docker build enviroment
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Extract the branch name.
      # - For PR, the branch name is "github.head_ref"
      # - For non-pull-request builds, the BRANCH_NAME env var will be empty.
      #   Extract it from GITHUB_REF in the format of refs/heads/<branch-name>
      - name: Get branch name
        id: branch_name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "branch=${BRANCH_NAME:-$(echo "$GITHUB_REF" | awk 'BEGIN { FS = "/" } ; { $1=$2=""; sub("  ",""); gsub(" ","/"); print }')}" >> "$GITHUB_OUTPUT"

      # Build docker image
      - name: Build docker image
        run: |
          mkdir docker/server/local_files
          docker image build \
            --file ./docker/server/Dockerfile \
            --build-arg branch=${{ steps.branch_name.outputs.branch }} \
            --tag server_docker \
            ./docker/server

      # Start the docker container
      - name: Start docker container
        run: |
          docker container run -dti --rm --name server \
            --entrypoint bash \
            server_docker

      # Run tests in the server docker container:
      # - Try to import the smurf module in the server container
      - name: Test importing the smurf module
        run: |
          docker container exec server \
            /bin/bash -c "python3 -c 'import rogue; import smurf;'"

      # - Try to instantiate the pysmurf's SmurfProcessor module in the server container
      - name: Test instantiating the SmurfProcessor module
        run: |
          docker container exec server \
            /bin/bash -c "python3 -c 'import pysmurf.core.devices; \
            s = pysmurf.core.devices.SmurfProcessor(name=\"\", description=\"\")'"

      # - Run the 'validate_filter.py' test script
      - name: Validate the SmurfProcessor filter
        run: |
          docker container exec server \
            /bin/bash -c "/usr/local/src/pysmurf/tests/core/validate_filter.py"

      # - Run the 'validate_unwrapper.py' test script
      - name: Validate the SmurfProcessor unwrapper
        run: |
          docker container exec server \
            /bin/bash -c "/usr/local/src/pysmurf/tests/core/validate_unwrapper.py"

      # - Run the 'validate_base_tx.py' test script
      - name: Validate the SmurfProcessor base transmitter
        run: |
          docker container exec server \
            /bin/bash -c "/usr/local/src/pysmurf/tests/core/validate_base_tx.py"

      # - Run the 'validate_cryo_operations.py' test script.
      #   Needs no hardware and no CryoDet package: it builds stand-in pyrogue
      #   devices for one band's CryoChannels, so the whole attach is checked
      #   here rather than only on a carrier.
      - name: Validate the cryo operations attachment
        run: |
          docker container exec server \
            /bin/bash -c "/usr/local/src/pysmurf/tests/core/validate_cryo_operations.py"

      # - Resolve the register names against a RELEASED firmware package, not the
      #   committed fixtures. The fixtures are pruned dumps built from this
      #   repository's own cryo-det, so they answer "do the names match the tree we
      #   build?"; this answers "do they match the tree SLAC shipped?", which is the
      #   question a deployment cares about. Runs here rather than in test-client
      #   because building a tree needs rogue, which only this container has.
      #
      #   A package dump has no server-added subtrees -- SmurfProcessor, the stream
      #   writers, SmurfApplication and the rest are added by the server at start-up --
      #   so --package-dump excludes those names and requires every name under the
      #   firmware's own tree to resolve.
      - name: Resolve the names against a released firmware package
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          tag=MicrowaveMuxBpEthGen2_v2.5.1
          zip=rogue_${tag}.zip
          id=$(curl --fail --silent --location \
                 --header "Authorization: token ${GITHUB_TOKEN}" \
                 "https://api.github.com/repos/slaclab/cryo-det/releases/tags/${tag}" \
               | python3 -c "import json,sys;
          print(next(a['id'] for a in json.load(sys.stdin)['assets']
                     if a['name'] == '${zip}'))")
          curl --fail --silent --location \
               --header "Authorization: token ${GITHUB_TOKEN}" \
               --header "Accept: application/octet-stream" \
               --output "${zip}" \
               "https://api.github.com/repos/slaclab/cryo-det/releases/assets/${id}"
          docker container cp "${zip}" server:/tmp/"${zip}"
          docker container cp tests/cryodaq/dump_released_tree.py \
            server:/tmp/dump_released_tree.py
          docker container exec server /bin/bash -c \
            "python3 /tmp/dump_released_tree.py --zip /tmp/${zip} \
               --out /tmp/released.varlist.txt"
          docker container cp server:/tmp/released.varlist.txt ./released.varlist.txt
          python3 tests/cryodaq/check_catalog_resolves.py \
            --package-dump ./released.varlist.txt

  # Client tests
  test-client:
    name: Client Tests
    runs-on: ubuntu-24.04
    needs: [flake8, docker-definitions]   # Run only if all checks passed
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Check that the cryodaq client keeps to its layer boundaries. Reads
      # source with 'ast', and imports the package to use the part of it that is
      # meant to work with nothing installed -- so it needs neither rogue nor a
      # container, and here, where rogue is absent, it proves that too.
      - name: Check the cryodaq layer boundaries
        run: python3 tests/cryodaq/check_boundaries.py

      # Check the platform layer's own logic: which platform a system is
      # identified as, and which indices of a scope a tree has. Answered from
      # supplied values, so this needs no tree and no rogue either.
      - name: Check the cryodaq platform maps
        run: python3 tests/cryodaq/check_platform_map.py

      # Resolve every catalog name against committed dumps of both firmware
      # generations, so a name that no longer matches the firmware fails a build
      # rather than a night on a crate. Reads the dumps out of the repository, so
      # this needs nothing installed and runs on a fork's pull request too.
      - name: Resolve the cryodaq names against firmware tree dumps
        run: python3 tests/cryodaq/check_catalog_resolves.py

      # sodetlib drives this client from another repository, so its use of it cannot
      # be found by reading this one: a refactor here can remove a method nothing
      # here calls and break an observatory's analysis code. The surface it depends
      # on is frozen, so a removal has to be a decision rather than an accident.
      - name: Check the sodetlib compatibility contract
        run: python3 tests/cryodaq/check_sodetlib_contract.py

      # Setup Docker build environment
      - name: Set up docker build enviroment
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Extract the branch name.
      # - For PR, the branch name is "github.head_ref"
      # - For non-pull-request builds, the BRANCH_NAME env var will be empty.
      #   Extract it from GITHUB_REF in the format of refs/heads/<branch-name>
      - name: Get branch name
        id: branch_name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "branch=${BRANCH_NAME:-$(echo "$GITHUB_REF" | awk 'BEGIN { FS = "/" } ; { $1=$2=""; sub("  ",""); gsub(" ","/"); print }')}" >> "$GITHUB_OUTPUT"	

      # Build docker image
      - name: Build docker Image
        run: |
          docker image build \
            --file ./docker/client/Dockerfile \
            --build-arg branch=${{ steps.branch_name.outputs.branch }} \
            --tag client_docker \
            ./docker/client

      # Start the docker container
      - name: Start docker container
        run: |
          docker container run -dti --rm --name client \
            --entrypoint bash \
            client_docker

      # Test docker image
      # - Try to import the pysmurf.client module in the client container
      #   Note: we need to disable the matplotlib graphics backend in order
      #         to be able to run in the runner.
      - name: Test docker container
        run: |
          docker container exec client \
            /bin/bash -c "python3 -c 'import matplotlib; matplotlib.use(\"Agg\"); import pysmurf.client'"

      # - Try to import the cryodaq module in the client container, which is
      #   where it is used from and the first place a packaging or import
      #   problem in it would show.
      - name: Test importing the cryodaq module
        run: |
          docker container exec client \
            /bin/bash -c "python3 -c 'import cryodaq; cryodaq.connect'"

      # - Import the register layer and check it resolves names rather than building
      #   paths. The client reaches registers through cryodaq.platform now, so an
      #   install that left that package out would still import the client and then
      #   fail on the first register access.
      - name: Test the register layer resolves by name
        run: |
          docker container exec client \
            /bin/bash -c "python3 -c 'from pysmurf.client.command.smurf_command \
            import SmurfCommandMixin as M; \
            assert hasattr(M, \"_get_by_name\") and hasattr(M, \"_resolve\"); \
            import cryodaq.platform as p; assert p.MAPS'"

  # Build

  # Build wheel
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-24.04
    needs: [test-docs, test-server, test-client]  # Run only if all tests passed
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # fetch all tags

      - name: Build sdist
        run: |
          python -m pip install --upgrade build hatch-vcs hatchling
          python -m build --sdist

      - name: Build wheel
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_BUILD: cp310-manylinux_x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_BEFORE_BUILD: pip install hatch-vcs hatchling Cython numpy setuptools

      - name: Collect dist files
        run: cp wheelhouse/*.whl dist/

      - name: Validate metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  # Deploy

  # Server docker
  deploy-server:
    name: Build Server Docker Image
    runs-on: ubuntu-24.04
    needs: [test-docs, test-server, test-client]  # Run only if all tests passed
    if: startsWith(github.ref, 'refs/tags/')      # Run only on tagged releases
    steps:
      # Checkout the code.
      # We use ssh key authentication to be able to access other private
      # repositories (like the firmware repository).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        #with:
        #  ssh-key: ${{ secrets.SLACLAB_KEY }}

      # Setup docker build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Login to Dockerhub
      - name: Login to Dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: slacrherbst
          password: ${{ secrets.GH_TOKEN }}

      # Build and push the docker image
      # Note about tokens: In this stage we need to use the SLACLAB TOKEN
      # to be able to access the other private repositories (GITHUB_TOKEN
      # only gives access to this repository).
      - name: Build and push image to Dockerhub
        id: build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.SWH76_TOKEN }}
        run: |
          cd docker/server/
          ./build.sh
          cd -

  # Client docker
  deploy-client:
    name: Build Client Docker Image
    runs-on: ubuntu-24.04
    needs: [test-docs, test-server, test-client]  # Run only if all tests passed
    if: startsWith(github.ref, 'refs/tags/')      # Run only on tagged releases
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Get the git tag from the environmental variables
      # It will used to tag the docker image
      - name: Get release tag
        id: get_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # Setup Docker build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Login to Dockerhub
      - name: Login to Dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: slacrherbst
          password: ${{ secrets.GH_TOKEN }}

      # Build and push the docker image
      - name: Build and push image to Dockerhub
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./docker/client
          file: ./docker/client/Dockerfile
          push: true
          tags: ghcr.io/slaclab/pysmurf-client:${{ steps.get_tag.outputs.tag }}
          build-args: branch=${{ steps.get_tag.outputs.tag }}

  # Deploy wheel to PyPI
  deploy-wheel:
    name: Publish to PyPI
    needs: [build-wheel]                          # Run only if wheel builds
    if: startsWith(github.ref, 'refs/tags/')      # Run only on tagged releases
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pysmurf-slac
    permissions:
      id-token: write  # required for trusted publishing
    steps:
    - name: download dist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: dist
        path: dist/

    - name: publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
